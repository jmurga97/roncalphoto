<!doctype html>
<html lang="es" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#f0ece7" />
    <meta
      name="description"
      content="Estudio de fotografía para bodas, eventos, inmuebles, arquitectura y momentos cotidianos. Descubre el portfolio de RoncalPhoto."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/manrope-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/newsreader-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <title>RoncalPhoto | Fotografía de bodas, eventos y espacios</title>
    <script>
      (() => {
        const storedLayoutUi = window.localStorage.getItem("roncal-layout-ui");
        let theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";

        if (storedLayoutUi) {
          try {
            const parsedValue = JSON.parse(storedLayoutUi);
            const persistedTheme = parsedValue?.version === 1 ? parsedValue.state?.theme : undefined;

            if (persistedTheme === "dark" || persistedTheme === "light") {
              theme = persistedTheme;
            }
          } catch {}
        }

        document.documentElement.dataset.theme = theme;
        // Status bar / browser chrome = --color-bg; the store effect keeps it in sync after load.
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", theme === "dark" ? "#171513" : "#f0ece7");
      })();
    </script>
  </head>
  <body class="h-full overflow-hidden antialiased">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
